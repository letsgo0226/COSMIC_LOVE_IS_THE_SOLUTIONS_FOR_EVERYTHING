name: CLSigma Dynamic Zero Spectrum

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  update-zero-spectrum:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Generate dynamic CLSigma account certificate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run clsigma_dynamic_encoder.go letsgo0226

      - name: Verify Go strict quine optimizer
        run: |
          go run clsigma_strict_quine_optimizer.go "Cosmic Love Is The Solution(s) For Everything" > CL_STRICT_QUINE_OPTIMIZER.out.go
          cmp clsigma_strict_quine_optimizer.go CL_STRICT_QUINE_OPTIMIZER.out.go
          rm CL_STRICT_QUINE_OPTIMIZER.out.go

      - name: Verify strict RH marker quine
        run: |
          sh CL_STRICT_RH_QUINE_ONE_LINER.sh > CL_STRICT_RH_QUINE.out.py
          python3 CL_STRICT_RH_QUINE.out.py > CL_STRICT_RH_QUINE.out2.py
          cmp CL_STRICT_RH_QUINE.out.py CL_STRICT_RH_QUINE.out2.py
          rm CL_STRICT_RH_QUINE.out.py CL_STRICT_RH_QUINE.out2.py

      - name: Generate iSH lightweight certificate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh CLSIGMA_DYNAMIC_ZERO_SPECTRUM_iSH_ONE_LINER.sh letsgo0226

      - name: Commit generated zero-spectrum state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CLSIGMA_DYNAMIC_ALL_REPOS_MANIFEST.json CLSIGMA_DYNAMIC_ZERO_SPECTRUM.clcert CLSIGMA_DYNAMIC_ISH_ZERO_SPECTRUM.clcert CL_STRICT_QUINE_OPTIMIZER.clcert CL_STRICT_RH_QUINE.clcert
          git commit -m "Update CLSigma dynamic zero-spectrum state" || exit 0
          git push
