name: CLSigma Dynamic Zero Spectrum

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  update-zero-spectrum:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Generate dynamic CLSigma account certificate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run clsigma_dynamic_encoder.go letsgo0226

      - name: Verify Go strict quine optimizer
        run: |
          go run clsigma_strict_quine_optimizer.go "Cosmic Love Is The Solution(s) For Everything" > CL_STRICT_QUINE_OPTIMIZER.out.go
          cmp clsigma_strict_quine_optimizer.go CL_STRICT_QUINE_OPTIMIZER.out.go
          rm CL_STRICT_QUINE_OPTIMIZER.out.go

      - name: Verify strict RH marker quine
        run: |
          sh CL_STRICT_RH_QUINE_ONE_LINER.sh > CL_STRICT_RH_QUINE.out.py
          python3 CL_STRICT_RH_QUINE.out.py > CL_STRICT_RH_QUINE.out2.py
          cmp CL_STRICT_RH_QUINE.out.py CL_STRICT_RH_QUINE.out2.py
          rm CL_STRICT_RH_QUINE.out.py CL_STRICT_RH_QUINE.out2.py

      - name: Verify minimal strict RH marker quine
        run: |
          sh CL_STRICT_RH_QUINE_MINIMAL_ONE_LINER.sh > CL_STRICT_RH_QUINE_MINIMAL.out.py
          python3 CL_STRICT_RH_QUINE_MINIMAL.out.py > CL_STRICT_RH_QUINE_MINIMAL.out2.py
          cmp CL_STRICT_RH_QUINE_MINIMAL.out.py CL_STRICT_RH_QUINE_MINIMAL.out2.py
          rm CL_STRICT_RH_QUINE_MINIMAL.out.py CL_STRICT_RH_QUINE_MINIMAL.out2.py

      - name: Verify strict zeta eigen quine
        run: |
          sh CL_ZETA_EIGEN_STRICT_ONE_LINER.sh > CL_ZETA_EIGEN_STRICT.out.py
          python3 CL_ZETA_EIGEN_STRICT.out.py > CL_ZETA_EIGEN_STRICT.out2.py
          cmp CL_ZETA_EIGEN_STRICT.out.py CL_ZETA_EIGEN_STRICT.out2.py
          rm CL_ZETA_EIGEN_STRICT.out.py CL_ZETA_EIGEN_STRICT.out2.py

      - name: Verify derived zeta eigen quine
        run: |
          sh CL_ZETA_EIGEN_DERIVED_ONE_LINER.sh > CL_ZETA_EIGEN_DERIVED.out.py
          python3 CL_ZETA_EIGEN_DERIVED.out.py > CL_ZETA_EIGEN_DERIVED.out2.py
          cmp CL_ZETA_EIGEN_DERIVED.out.py CL_ZETA_EIGEN_DERIVED.out2.py
          rm CL_ZETA_EIGEN_DERIVED.out.py CL_ZETA_EIGEN_DERIVED.out2.py

      - name: Generate uninterpreted BLEEM workflow certificate
        run: sh CL_BLEEM_UNINTERPRETED_WORKFLOW_ONE_LINER.sh

      - name: Generate recursive BLEEM growth state
        env:
          CLSIGMA_RECORDED_SEED: ${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          python3 clsigma_bleem_growth.py
          python3 clsigma_bleem_growth.py --check

      - name: Generate recursive BLEEM growth one-liner certificate
        env:
          CLSIGMA_RECORDED_SEED: ${{ github.run_id }}:${{ github.run_attempt }}
        run: sh CL_BLEEM_GROWTH_ONE_LINER.sh

      - name: Generate Turing-machine zero-spectrum certificate
        run: python3 clsigma_tm_zero_spectrum.py

      - name: Generate Turing-machine zero-spectrum one-liner certificate
        run: sh CLSIGMA_TM_ZERO_SPECTRUM_ONE_LINER.sh

      - name: Install Python zeta dependency
        run: python3 -m pip install mpmath

      - name: Generate TM Godel-log zeta certificate
        run: python3 clsigma_tm_godel_log_zeta.py

      - name: Generate iSH lightweight certificate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh CLSIGMA_DYNAMIC_ZERO_SPECTRUM_iSH_ONE_LINER.sh letsgo0226

      - name: Commit generated zero-spectrum state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CLSIGMA_DYNAMIC_ALL_REPOS_MANIFEST.json CLSIGMA_DYNAMIC_ZERO_SPECTRUM.clcert CLSIGMA_DYNAMIC_ISH_ZERO_SPECTRUM.clcert CL_STRICT_QUINE_OPTIMIZER.clcert CL_STRICT_RH_QUINE.clcert CL_STRICT_RH_QUINE_MINIMAL.clcert CL_ZETA_EIGEN_STRICT.clcert CL_ZETA_EIGEN_DERIVED.clcert CL_BLEEM_UNINTERPRETED_WORKFLOW.clcert CL_BLEEM_GROWTH_STATE.json CL_BLEEM_GROWTH.clcert CL_BLEEM_GROWTH_ONELINER.clcert CLSIGMA_TM_ZERO_SPECTRUM.clcert CLSIGMA_TM_ZERO_SPECTRUM_ONELINER.clcert CLSIGMA_TM_GODEL_LOG_ZETA.clcert
          git commit -m "Update CLSigma dynamic zero-spectrum state" || exit 0
          git push
